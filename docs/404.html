  <body class="bg-slate-950 text-slate-100 antialiased font-['Cairo',sans-serif] selection:bg-amber-500 selection:text-white transition-colors duration-200">
    <div id="root">
      {/* Instant 0ms HTML/CSS Preloader (Eliminates white screen on page refresh before JS mounts) */}
      <div id="app-preloader" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#020617;color:#ffffff;font-family:'Cairo',sans-serif;direction:rtl;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;">
          <div style="width:96px;height:96px;border-radius:50%;border:4px solid rgba(245,158,11,0.2);border-top-color:#f59e0b;animation:preloader-spin 1s linear infinite;box-shadow:0 10px 25px -5px rgba(245,158,11,0.3);"></div>
          <div style="position:absolute;width:64px;height:64px;border-radius:50%;background:linear-gradient(to top right, #f59e0b, #facc15);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px;box-shadow:0 10px 20px -5px rgba(245,158,11,0.4);">
            <img id="preloader-logo" src="" alt="Logo" style="width:100%;height:100%;object-fit:contain;border-radius:50%;background:#020617;display:none;padding:2px;" />
            <svg id="preloader-fallback" style="width:32px;height:32px;color:#020617;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m11-16v4m-2-2h4m-2 10l-4 4m0 0l-4-4m4 4V11" /></svg>
          </div>
        </div>
        <h2 id="preloader-title" style="margin-top:24px;font-size:20px;font-weight:900;color:#ffffff;letter-spacing:-0.5px;text-align:center;">جاري تحميل المتجر...</h2>
        <p style="margin-top:4px;font-size:12px;color:#94a3b8;text-align:center;">متجر المنتجات الرقمية والبطاقات</p>
        <style>@keyframes preloader-spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}</style>
        <script>
          (function() {
            try {
              var logo = localStorage.getItem('dz_store_logo');
              var name = localStorage.getItem('dz_store_name');
              if (logo && logo.trim()) {
                var imgEl = document.getElementById('preloader-logo');
                var fallbackEl = document.getElementById('preloader-fallback');
                if (imgEl) {
                  imgEl.src = logo.trim();
                  imgEl.style.display = 'block';
                  if (fallbackEl) fallbackEl.style.display = 'none';
                }
              }
              if (name && name.trim()) {
                var titleEl = document.getElementById('preloader-title');
                if (titleEl) titleEl.textContent = name.trim();
              }
            } catch(e) {}
          })();
        </script>
      </div>
    </div>
  </body>
